<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Profile Completion Suggestions</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f3f4f6;

        }

        .card {
            width: 100%;
            margin: auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .header h2 {
            font-size: 18px;
            color: #1f2937;
            margin: 0;
        }

        .percentage {
            font-size: 14px;
            font-weight: bold;
            color: #4f46e5;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 50px;
            overflow: hidden;
            margin-bottom: 18px;
        }

        .progress {
            height: 100%;
            width: 80%;
            background: #4f46e5;
        }

        .info {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 16px;
        }

        .suggestion {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .dot {
            width: 8px;
            height: 8px;
            margin-top: 6px;
            border-radius: 50%;
            background: #4f46e5;
            flex-shrink: 0;
        }

        .suggestion-content {
            flex: 1;
        }

        .suggestion-title {
            font-size: 14px;
            font-weight: bold;
            color: #111827;
            margin: 0 0 4px 0;
        }

        .suggestion-text {
            font-size: 12px;
            color: #6b7280;
            margin: 0;
        }

        .action-btn {
            font-size: 12px;
            background: none;
            border: none;
            color: #4f46e5;
            cursor: pointer;
            font-weight: bold;
        }

        .action-btn:hover {
            text-decoration: underline;
        }

        .main-btn {
            width: 100%;
            margin-top: 16px;
            padding: 10px;
            border-radius: 12px;
            border: none;
            background: #0A66C2;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .main-btn:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>Profile Strength</h2>
        <span class="percentage">80% Complete</span>
    </div>

    <div class="progress-bar">
        <div class="progress"></div>
    </div>

    <p class="info">Complete your profile to get better job and exam recommendations 🚀</p>

    <div class="suggestion">
        <div class="dot"></div>
        <div class="suggestion-content">
            <p class="suggestion-title">Add work experience</p>
            <p class="suggestion-text">Experience increases recruiter trust</p>
        </div>
        <button class="action-btn">Update</button>
    </div>

    <div class="suggestion">
        <div class="dot"></div>
        <div class="suggestion-content">
            <p class="suggestion-title">Upload profile photo</p>
            <p class="suggestion-text">Profiles with photos get more views</p>
        </div>
        <button class="action-btn">Upload</button>
    </div>

    <div class="suggestion">
        <div class="dot"></div>
        <div class="suggestion-content">
            <p class="suggestion-title">Add skills</p>
            <p class="suggestion-text">Skills help match relevant jobs</p>
        </div>
        <button class="action-btn">Add</button>
    </div>

    <button (click)="
    navigateToEditForm()" class="main-btn btn-primary">Complete Profile Now</button>
</div>

</body>
</html>
